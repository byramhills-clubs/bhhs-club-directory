
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" href="https://raw.githubusercontent.com/byramhills-clubs/bhhs-club-directory/main/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byram Hills Club Directory</title>

<style>
* {
  box-sizing: border-box;
}

.image-wall {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.image {
  position: absolute;
  object-fit: cover;
  border-radius: 12px;
  opacity: 0;
  border: none;
  animation: appear 1s ease forwards;
}

.image:nth-child(1) { left: 2%; top: 3%; width: 17%; height: 32%; --rotation: -7deg; animation-delay: 0s; }
.image:nth-child(2) { left: 22%; top: -5%; width: 16%; height: 27%; --rotation: 5deg; animation-delay: .1s; }
.image:nth-child(3) { right: 22%; top: -3%; width: 17%; height: 29%; --rotation: -5deg; animation-delay: .2s; }
.image:nth-child(4) { right: 2%; top: 5%; width: 18%; height: 32%; --rotation: 7deg; animation-delay: .3s; }
.image:nth-child(5) { left: -4%; top: 40%; width: 19%; height: 32%; --rotation: 6deg; animation-delay: .4s; }
.image:nth-child(6) { right: -3%; top: 42%; width: 20%; height: 32%; --rotation: -7deg; animation-delay: .5s; }
.image:nth-child(7) { left: 5%; bottom: -5%; width: 18%; height: 30%; --rotation: -5deg; animation-delay: .6s; }
.image:nth-child(8) { left: 28%; bottom: -8%; width: 17%; height: 28%; --rotation: 5deg; animation-delay: .7s; }
.image:nth-child(9) { right: 27%; bottom: -7%; width: 18%; height: 30%; --rotation: -5deg; animation-delay: .8s; }
.image:nth-child(10) { right: 5%; bottom: -5%; width: 17%; height: 29%; --rotation: 6deg; animation-delay: .9s; }

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(35px) rotate(var(--rotation)) scale(.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) rotate(var(--rotation)) scale(1);
  }
}

.image-wall.fade-out .image {
  opacity: 0 !important;
  transition: opacity 0.8s ease;
  animation: none;
  transform: translateY(0) rotate(var(--rotation)) scale(1);
}

#content {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: radial-gradient(ellipse, rgba(0,0,0,.2), rgba(0,0,0,.35));
  transition: justify-content .7s ease;
  overflow: hidden;
}

#logo, #thingy {
  flex-shrink: 0;
  transition: transform .7s ease, width .7s ease;
}

#logo {
  width: 70pt;
}

#thingy {
  width: 500pt;
}

#TheButton {
  margin-top: 35px;
  padding: 18px 35px;
  border: 1pt solid white;
  border-radius: 40px;
  background: none;
  color: white;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
  transition: opacity .3s ease;
}

#TheButton:hover {
  background: white;
  color: black;
}


#clubList {
  display: none;
  width: min(700px, 90vw);
  height: 0;
  background: rgb(23,23,23);
  border-radius: 20px;
  margin-top: 25px;
  opacity: 0;
  overflow-y: auto;
  transition: height .7s ease, opacity .5s ease;
}

#content.open {
  justify-content: flex-start;
  padding-top: 25px;
}

#content.open #logo {
  transform: scale(.75);
}

#content.open #thingy {
  transform: scale(.75);
}

#content.open #TheButton {
  display: none;
}

#content.open #clubList {
  display: block;
  height: 65vh;
  opacity: 1;
  animation: popup .7s ease forwards;
}

@keyframes popup {
  from {
    transform: translateY(80px) scale(.95);
    opacity: 0;
  }
  to {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

@media (max-width: 800px) {
  .image {
    display: none;
  }

  #thingy {
    width: 300pt;
  }

  #TheButton {
    width: 120pt;
    height: 40pt;
    border-radius: 15pt;
    padding: 5pt 10pt;
  }

  #content.open {
    padding-top: 15px;
  }

  #content.open #logo {
    transform: scale(.65);
  }

  #content.open #thingy {
    transform: scale(.75);
  }

  #content.open #clubList {
    width: 95vw;
    height: 65vh;
  }
}

#clubList {
  padding: 15px;
}

.club-card {
  background: none;
  color: white;
  text-align: left;
  padding: 20px;
  padding-top: 5pt;
  margin-bottom: 15px;
  border-radius: 14px;
}

.club-card h2 {
  margin: 0 0 5px;
}

.club-card p {
  line-height: 1.5;
}

.club-category {
  display: inline-block;
  background: #505050;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.club-card a {
  color: #8abaff;
  text-decoration: none;
}

</style>
</head>

  <img class="image" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.lohud.com%2Fgcdn%2Fpresto%2F2018%2F09%2F29%2FPWES%2F437371d8-448c-4861-9759-2bd1f30dac87-fb092818byram02.jpg&f=1&nofb=1">
  <img class="image" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.byramhills.org%2Fuploaded%2FMedia_Center%2F2025-2026%2FPress_Releases%2FCum_Laude_Induction%2FCL_FullGroup.jpg&f=1&nofb=1">
  <img class="image" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.byramhills.org%2Fuploaded%2FMedia_Center%2F2023-2024_School_Year%2FSpectrum_Story_Images%2FRobotics_1.jpg&f=1&nofb=1">
</div>

<div id="content">
  <img id="logo" src="https://raw.githubusercontent.com/byramhills-clubs/bhhs-club-directory/main/bhLogo.png">
  <img id="thingy" src="https://raw.githubusercontent.com/byramhills-clubs/bhhs-club-directory/main/Clubs.png">
  <button id="TheButton" onclick="browse()">Find Clubs ↗</button>
  <div id="clubList"></div>
</div>

<script>
function browse() {
  document.querySelector('.image-wall').classList.add('fade-out');
  document.getElementById('content').classList.add('open');
  displayClubs();
}
</script>
