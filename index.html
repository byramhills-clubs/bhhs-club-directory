<title>Byram Hills Club Directory</title>

<style>
* {
  box-sizing: border-box;
}

.image-wall {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.image {
  transition: transform 150ms ease-out;
  position: absolute;
  object-fit: cover;
  border-radius: 12px;
  opacity: 0;
  border: none;
  animation: appear 1s ease forwards;
}

.image:nth-child(1) { left: 2%; top: 3%; width: 17%; height: 32%; --rotation: -7deg; animation-delay: 0s, 1s; }
.image:nth-child(2) { left: 22%; top: -5%; width: 16%; height: 27%; --rotation: 5deg; animation-delay: .1s, 1.1s; }
.image:nth-child(3) { right: 22%; top: -3%; width: 17%; height: 29%; --rotation: -5deg; animation-delay: .2s, 1.2s; }
.image:nth-child(4) { right: 2%; top: 5%; width: 18%; height: 32%; --rotation: 7deg; animation-delay: .3s, 1.3s; }
.image:nth-child(5) { left: -4%; top: 40%; width: 19%; height: 32%; --rotation: 6deg; animation-delay: .4s, 1.4s; }
.image:nth-child(6) { right: -3%; top: 42%; width: 20%; height: 32%; --rotation: -7deg; animation-delay: .5s, 1.5s; }
.image:nth-child(7) { left: 5%; bottom: -5%; width: 18%; height: 30%; --rotation: -5deg; animation-delay: .6s, 1.6s; }
.image:nth-child(8) { left: 28%; bottom: -8%; width: 17%; height: 28%; --rotation: 5deg; animation-delay: .7s, 1.7s; }
.image:nth-child(9) { right: 27%; bottom: -7%; width: 18%; height: 30%; --rotation: -5deg; animation-delay: .8s, 1.8s; }
.image:nth-child(10) { right: 5%; bottom: -5%; width: 17%; height: 29%; --rotation: 6deg; animation-delay: .9s, 1.9s; }

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(35px) rotate(var(--rotation))
    skew(var(--skew-x, 0deg), var(--skew-y, 0deg)) scale(.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) rotate(var(--rotation))
    skew(var(--skew-x, 0deg), var(--skew-y, 0deg)) scale(1);
  }
}

.content {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: radial-gradient(ellipse, rgba(0, 0, 0, .2), rgba(0, 0, 0, .35));
}

h1 {
  color: white;
  font-size: clamp(55px, 10vw, 90px);
  font-weight: 900;
  letter-spacing: -6px;
  margin: 0;
  text-shadow: 0 5px 30px #000;
}

button {
  margin-top: 35px;
  padding: 18px 35px;
  border: 1pt solid white;
  border-radius: 40px;
  background: none;
  color: white;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
  transition: .4s;
}

button:hover {
  background: white;
  color: black;
}

@media (max-width: 800px) {
  .image {
    display: none;
  }
  #thingy{
    width: 300pt;
  }
}

</style>
</head>

<script>
const images = document.querySelectorAll(".image");

function skewImagesTowardCursor(event) {
  const pointerX = event.clientX;
  const pointerY = event.clientY;

  images.forEach((image) => {
    const rect = image.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    // Skew each image according to the cursor's position relative to it.
    const skewX = ((pointerX - centerX) / window.innerWidth) * 12;
    const skewY = ((pointerY - centerY) / window.innerHeight) * 6;

    image.style.setProperty("--skew-x", `${skewX}deg`);
    image.style.setProperty("--skew-y", `${skewY}deg`);
  });
}

window.addEventListener("pointermove", skewImagesTowardCursor);
</script>
